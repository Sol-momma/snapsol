name: Snapsol
options:
  bundleIdPrefix: com.solmomma
  deploymentTarget:
    macOS: "26.0"
  # Icon Composer の .icon はフォルダだが、Xcode には 1 ファイルとして渡して actool にコンパイルさせる
  fileTypes:
    icon:
      file: true
      buildPhase: resources
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: TGH9CKLLPU
    CODE_SIGN_STYLE: Automatic
targets:
  Snapsol:
    type: application
    platform: macOS
    sources:
      - Snapsol
      - Resources/Snapsol.icon
    info:
      path: Snapsol/Info.plist
      properties:
        CFBundleDisplayName: Snapsol
        LSUIElement: true
        NSScreenCaptureUsageDescription: スクリーンショットを撮影するために画面収録の権限が必要です。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solmomma.snapsol
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: false
        ASSETCATALOG_COMPILER_APPICON_NAME: Snapsol
    scheme:
      testTargets: [SnapsolTests]
  # アプリを起動しない非ホスト型テスト。Presentation / App を含めないことで、
  # 下位層が Presentation / App の型を参照したらコンパイルエラーになる（フレームワークの import は検出できない）
  SnapsolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SnapsolTests
      - Snapsol/Domain
      - Snapsol/Application
      - Snapsol/Infrastructure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solmomma.snapsol.tests
        GENERATE_INFOPLIST_FILE: true
